name: CommitSync
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    DEVELOPMENT_TEAM: WDKDNA9572
    TARGETED_DEVICE_FAMILY: 1
packages:
  SwiftGitX:
    path: Vendor/SwiftGitX
targets:
  CommitSync:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: CommitSync
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchStoryboardName: LaunchScreen
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        BGTaskSchedulerPermittedIdentifiers:
          - com.vessy.CommitSync.sync
        NSFaceIDUsageDescription: Authenticate to unlock the app and access encrypted key passphrases.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync
        DEVELOPMENT_TEAM: WDKDNA9572
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: true
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: Core
      - target: Storage
      - target: SecurityEngine
      - target: GitEngine
      - target: BackgroundSync

  Core:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Core/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync.Core
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1

  Storage:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Storage/Sources
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync.Storage
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1

  SecurityEngine:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: SecurityEngine/Sources
    dependencies:
      - target: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync.SecurityEngine
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1

  GitEngine:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: GitEngine/Sources
      - path: GitEngine/Resources
        buildPhase: resources
    dependencies:
      - target: Core
      - package: SwiftGitX
        product: SwiftGitX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync.GitEngine
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1

  BackgroundSync:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: BackgroundSync/Sources
    dependencies:
      - target: Core
      - target: GitEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync.BackgroundSync
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1

  CommitSyncTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CommitSyncTests
    dependencies:
      - target: CommitSync
      - target: Core
      - target: Storage
      - target: SecurityEngine
      - target: GitEngine
      - target: BackgroundSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync.Tests
        DEVELOPMENT_TEAM: WDKDNA9572
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1

  CommitSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CommitSyncUITests
    dependencies:
      - target: CommitSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vessy.CommitSync.UITests
        DEVELOPMENT_TEAM: WDKDNA9572
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: true
        TARGETED_DEVICE_FAMILY: 1
